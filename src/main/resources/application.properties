spring.application.name=instagram-auto-post
server.port=8080

spring.config.import=${app.config-file:file:./config/secrets.properties}

openai.base-url=https://api.openai.com
openai.image-model=gpt-image-2.5-flare
openai.image-size=1088x1360
openai.image-quality=medium

instagram.base-url=https://graph.instagram.com
instagram.api-version=v26.0

app.prompt-file=${app.base-dir:.}/config/prompt.txt
app.caption-file=${app.base-dir:.}/config/caption.txt
app.image-dir=${app.base-dir:.}/data/posts
app.logo-file=${app.base-dir:.}/config/assets/ctk-logo-192.png
app.state-file=${app.base-dir:.}/data/last-successful-post.txt

app.schedule.cron=0 0 11,17 * * *
app.schedule.zone=America/Sao_Paulo
app.scheduler.enabled=false

logging.level.root=INFO
logging.level.br.com.instagrambot=INFO
